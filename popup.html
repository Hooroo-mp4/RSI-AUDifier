<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RSI AUDifier</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="logo" src="icons/icon48.png" alt="" width="32" height="32">
    <div>
      <div class="name">RSI AUDifier</div>
      <div class="ver" id="version"></div>
    </div>
  </header>

  <section>
    <label class="row" for="permanent">
      <span>
        <span class="label">Always show AUD</span>
        <span class="desc">Convert every price without hovering. Hover a price to peek at the USD.</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="permanent">
        <span class="slider"></span>
      </span>
    </label>
    <div class="rate" id="rate">Loading exchange rate…</div>
  </section>

  <footer>
    Prices aren't always exact and can be off by around a dollar. Some companies, like PayPal, also charge a currency conversion fee.
  </footer>
  <script src="popup.js"></script>
</body>
</html>
